<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Tiro con Arco VR - Redmi Note 11 & VR Shinecon</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        .reticle {
            position: absolute; top: 50%; left: 25%; transform: translate(-50%, -50%);
            width: 12px; height: 12px; border: 2px solid rgba(255,255,255,0.8);
            border-radius: 50%; pointer-events: none; z-index: 10; display: none;
        }
        .reticle-right { left: 75%; }
    </style>
</head>
<body class="select-none">

    <div id="canvas-container"></div>

    <!-- Puntos de mira para cada ojo en pantalla dividida -->
    <div id="reticle-l" class="reticle"></div>
    <div id="reticle-r" class="reticle reticle-right"></div>

    <!-- Pantalla de Inicio -->
    <div id="overlay" class="absolute inset-0 bg-emerald-950/90 flex flex-col justify-center items-center p-6 text-center z-20">
        <h1 class="text-3xl font-bold text-amber-400 mb-2">TIRO CON ARCO VR</h1>
        <p class="text-emerald-200 text-sm mb-6 max-w-xs">Diseñado para Redmi Note 11 + Visor VR Shinecon</p>
        
        <button id="start-btn" class="w-full max-w-xs py-4 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black rounded-xl text-base uppercase shadow-lg transition transform active:scale-95 mb-4">
            🚀 INICIAR EN VR (PANTALLA DIVIDIDA)
        </button>

        <p class="text-xs text-emerald-400/70">Si el juego no gira al mover el teléfono, asegúrate de haber abierto la página con un servidor <b>http://localhost</b>.</p>
    </div>

    <script>
        let scene, camera, renderer;
        let bowGroup, arrowMesh, targetGroup;
        let isVR = false;
        let alpha = 0, beta = 0, gamma = 0;

        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f291e);
            scene.fog = new THREE.FogExp2(0x0f291e, 0.015);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // Luces
            const light = new THREE.DirectionalLight(0xffffff, 1.2);
            light.position.set(10, 20, 10);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0x404040, 0.8));

            // Suelo
            const groundGeo = new THREE.PlaneGeometry(100, 100);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x15803d });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            scene.add(ground);

            buildBow();
            buildTarget();

            // Capturar giroscopio nativo del móvil
            window.addEventListener('deviceorientation', handleOrientation);
            window.addEventListener('resize', onResize);

            document.getElementById('start-btn').addEventListener('click', startVR);

            renderer.setAnimationLoop(animate);
        }

        function buildBow() {
            bowGroup = new THREE.Group();
            const bowGeo = new THREE.TorusGeometry(0.4, 0.015, 8, 24, Math.PI);
            const bowMat = new THREE.MeshStandardMaterial({ color: 0x78350f });
            const bowMesh = new THREE.Mesh(bowGeo, bowMat);
            bowMesh.rotation.z = -Math.PI / 2;
            bowGroup.add(bowMesh);

            const arrowGeo = new THREE.CylinderGeometry(0.008, 0.008, 0.7);
            arrowGeo.rotateX(Math.PI / 2);
            const arrowMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b });
            arrowMesh = new THREE.Mesh(arrowGeo, arrowMat);
            arrowMesh.position.z = -0.2;
            bowGroup.add(arrowMesh);

            bowGroup.position.set(0.15, -0.2, -0.5);
            camera.add(bowGroup);
            scene.add(camera);
        }

        function buildTarget() {
            targetGroup = new THREE.Group();
            const targetGeo = new THREE.CylinderGeometry(0.8, 0.8, 0.1, 32);
            targetGeo.rotateX(Math.PI / 2);
            const targetMat = new THREE.MeshStandardMaterial({ color: 0xdc2626 });
            const targetDisk = new THREE.Mesh(targetGeo, targetMat);
            
            targetGroup.add(targetDisk);
            targetGroup.position.set(0, 1.6, -12);
            scene.add(targetGroup);
        }

        function handleOrientation(event) {
            // Recibir datos del giroscopio del Redmi
            if (event.beta !== null) {
                beta = THREE.MathUtils.degToRad(event.beta);
                gamma = THREE.MathUtils.degToRad(event.gamma);
                alpha = THREE.MathUtils.degToRad(event.alpha || 0);

                // Aplicar rotación a la cámara
                camera.rotation.set(beta - Math.PI / 2, gamma, alpha, 'YXZ');
            }
        }

        function startVR() {
            isVR = true;
            document.getElementById('overlay').classList.add('hidden');
            document.getElementById('reticle-l').style.display = 'block';
            document.getElementById('reticle-r').style.display = 'block';

            // Activar pantalla completa si es posible
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            }
        }

        function animate() {
            if (isVR) {
                const width = window.innerWidth;
                const height = window.innerHeight;

                // Renderizar Ojo Izquierdo
                renderer.setViewport(0, 0, width / 2, height);
                renderer.setScissor(0, 0, width / 2, height);
                renderer.setScissorTest(true);
                camera.aspect = (width / 2) / height;
                camera.updateProjectionMatrix();
                renderer.render(scene, camera);

                // Renderizar Ojo Derecho
                renderer.setViewport(width / 2, 0, width / 2, height);
                renderer.setScissor(width / 2, 0, width / 2, height);
                renderer.setScissorTest(true);
                renderer.render(scene, camera);
            } else {
                renderer.setViewport(0, 0, window.innerWidth, window.innerHeight);
                renderer.setScissorTest(false);
                renderer.render(scene, camera);
            }
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = init;
    </script>
</body>
</html>
